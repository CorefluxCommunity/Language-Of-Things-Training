# Mosquitto Configuration for LoT Training Bridge Exercises
# This is the secondary MQTT broker for testing MQTT bridge routes

# =============================================================================
# General Configuration
# =============================================================================
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# =============================================================================
# Listeners
# =============================================================================
# MQTT listener (maps to host port 1884)
listener 1883
protocol mqtt

# WebSocket listener (maps to host port 9001)
listener 9001
protocol websockets

# =============================================================================
# Security
# =============================================================================
# Allow anonymous connections for training purposes
# In production, always use authentication!
allow_anonymous true

# =============================================================================
# Message Settings
# =============================================================================
max_queued_messages 1000
max_packet_size 1048576

# =============================================================================
# Logging
# =============================================================================
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
